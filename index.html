<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWAMINI CHAT WEB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-container" class="auth-screen">
        <div class="auth-box">
            <h1>MWAMINI CHAT WEB</h1>
            <p>Secure Real-time Messaging</p>
            <input type="email" id="auth-email" placeholder="Email Address">
            <input type="password" id="auth-password" placeholder="Password">
            <div class="auth-buttons">
                <button id="btn-login">Login</button>
                <button id="btn-register">Register</button>
            </div>
        </div>
    </div>

    <div id="dashboard-container" class="dashboard-screen hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Chats</h3>
                <button id="btn-logout">Logout</button>
            </div>
            <div id="user-list" class="list-container"></div>
        </div>

        <div class="chat-area">
            <div id="chat-header" class="chat-header">Select a contact to start</div>
            <div id="chat-messages" class="messages-container"></div>
            
            <div id="chat-input-area" class="chat-input-bar hidden">
                <input type="file" id="media-input" accept="image/*,video/*" style="display:none;">
                <button id="btn-attach" onclick="document.getElementById('media-input').click()">📎</button>
                <input type="text" id="text-input" placeholder="Type a message...">
                <button id="btn-send">Send</button>
            </div>
            <div id="upload-status" class="status-overlay">Uploading to Cloudinary...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
